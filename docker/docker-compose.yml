services:
    server:
        build:
            context: ../
            dockerfile: docker/Dockerfile
        container_name: statsfm-server
        restart: unless-stopped
        environment:
            LISTEN_ADDR: ":8080"
        ports:
            - "2812:8080"
        healthcheck:
            test: ["CMD", "/server", "healthcheck"]
            interval: 30s
            timeout: 3s
            start_period: 5s
            retries: 3
